plugins {
    id "com.gradleup.shadow" version "9.4.2"
}

apply plugin: "architectury-plugin"

architectury {
    //platformSetupLoomIde()
    //neoForge()
}

repositories{
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url "https://maven.shedaniel.me/" }
    maven {
        name "CreeperHost"
        url "https://maven.creeperhost.net"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    // Remove the next line if you don't want to depend on the API
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_version"

    implementation "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"

    implementation(project(":common")) { transitive false }

    forgeRuntimeLibrary "org.json:json:${json_version}"
    include("org.json:json:${json_version}")
    shadowCommon("org.json:json:${json_version}")

    forgeRuntimeLibrary "net.objecthunter:exp4j:${exp4j_version}"
    include("net.objecthunter:exp4j:${exp4j_version}")
    shadowCommon("net.objecthunter:exp4j:${exp4j_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set(null)
    relocate 'org.json', 'speedometer.shaded.org.json'
    relocate 'net.objecthunter', 'speedometer.shaded.net.objecthunter'
    archiveFileName.set("${rootProject.archives_base_name}-neoforge-${rootProject.mod_version}_${rootProject.minecraft_version}.jar")

    // Shade the common module
    from project(":common").sourceSets.main.output
    from project(":common").sourceSets.main.resources.srcDirs
}

jar {
    enabled = false
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}



publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}