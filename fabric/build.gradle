plugins {
    id "com.gradleup.shadow" version "9.4.2"
}

apply plugin: "architectury-plugin"

architectury {
    //platformSetupLoomIde()
    //fabric()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.nucleoid.xyz/" }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}+${rootProject.minecraft_version}"
    // Remove the next line if you don't want to depend on the API
    api "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    api "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"
    api "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    api "eu.pb4:placeholder-api:2.4.0-pre.2+1.21"

    implementation(project(":common")) { transitive false }

    include("org.json:json:${json_version}")
    shadowCommon("org.json:json:${json_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set(null)
    relocate 'org.json', 'speedometer.shaded.org.json'
    archiveFileName.set("${rootProject.archives_base_name}-fabric-${rootProject.mod_version}_${rootProject.minecraft_version}.jar")

    // Shade the common module
    from project(":common").sourceSets.main.output
    from project(":common").sourceSets.main.resources.srcDirs
}

jar {
    enabled = false
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}